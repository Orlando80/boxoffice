# PROPOSAL: the owner renames this file to deploy.yml by hand (protect-paths
# blocks agents from writing deploy.yml). Until then it is inactive.
#
# The Dockerfiles it builds (apps/<app>/Dockerfile) land in step 13 of
# intent/monorepo-skeleton/plan.md.
#
# Builds one image per app and pushes to ghcr.io/<lowercased owner>/boxoffice-<app>
# tagged with the commit SHA. Push happens on push to main and on same-repo PRs;
# fork PRs build without pushing. No hosting deploy happens here.
name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin, scanner, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Read Node version
        id: node
        run: echo "version=$(tr -d 'v\r\n' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/boxoffice-${{ matrix.app }}:${{ github.event.pull_request.head.sha || github.sha }}
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
